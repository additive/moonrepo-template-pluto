# https://moonrepo.dev/docs/config/workspace
$schema: 'https://moonrepo.dev/schemas/workspace.json'

# defaultProject: 'pluto'

# projects:
#   globFormat: 'source-path'
#   glob:
#     - 'apps/*'
#     - 'libs/*'
projects:
  - 'apps/*'
  - 'libs/*'

generator:
  templates:
    - './templates/libs'

vcs:
  manager: 'git'
  defaultBranch: 'main'
  provider: 'github'
  syncHooks: true
  hooks:
    pre-commit:
      - 'moon run :lint --affected --status=staged'
    commit-msg:
      - 'pnpm commitlint --edit --no-color'

telemetry: true

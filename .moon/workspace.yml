# https://moonrepo.dev/docs/config/workspace
$schema: './cache/schemas/workspace.json'

projects:
  - apps/*
  - libs/*

generator:
  templates:
    - ./templates/libs

vcs:
  defaultBranch: main
  provider: github
  sync: true
  hooks:
    pre-commit:
      - just lint-staged
      - moon run :lint --affected --status=staged
      - gitleaks git --pre-commit --redact --staged --no-banner
    commit-msg:
      - pnpm commitlint --edit --no-color

telemetry: false

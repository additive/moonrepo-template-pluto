$schema: 'https://moonrepo.dev/schemas/tasks.json'

tasks:
  lint:
    deps:
      - run-eslint
      - run-biome
      - run-prettier
      - run-stylelint

  format:
    options:
      mergeArgs: append
      runDepsInParallel: false
    deps:
      - target: 'run-eslint'
        args: '--fix'
      - target: 'run-biome'
        args:
          - '--write'
          - '--unsafe'
      - target: 'run-prettier'
        args: '--write'
      - target: 'run-stylelint'
        args: '--fix'

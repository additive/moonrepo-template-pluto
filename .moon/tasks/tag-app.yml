$schema: '../cache/schemas/tasks.json'

fileGroups:
  app:
    - 'src/**/*.{ts,html}'
    - /angular.json

tasks:
  dev:
    command: ng serve
    env:
      NODE_ENV: development
    deps:
      - target: generator-dev-certs
        env:
          HOST: pluto-host.local

  build:
    description: Builds the app in production mode
    command: ng build
    env:
      NODE_ENV: production
    options:
      cache: false
    inputs:
      - '@group(app)'
      - '@group(sources)'
      - '@group(styles)'
      - '@group(assets)'
    outputs:
      - dist/browser/

  build-dev:
    description: Builds the app in development mode
    extends: build
    args: -c development
    env:
      NODE_ENV: development

  build-analyse:
    description: Builds the app for analysis
    extends: build
    args: --stats-json

  build-pack:
    description: Packages a build for deployment, versioned and dated
    script: |
      cp $projectRoot/dist/3rdpartylicenses.txt $projectRoot/dist/browser/assets/licenses.txt
      cd $projectRoot/dist/
      zip -FSrq "$project.zip" browser
      VERSION=$(yq -r '.version' $projectRoot/package.json)
      cp "$project.zip" "$project-v$VERSION-$date.zip"
    options:
      cache: false

  build-release:
    description: Builds a deployable release
    script: echo "Done"
    deps:
      - build
      - build-pack
    options:
      runDepsInParallel: false

inheritedBy:
  tag: app

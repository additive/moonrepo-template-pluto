<header class="border-b border-slate-700/50">
	<div class="container mx-auto flex items-center justify-between px-6 py-4">
		<a routerLink="/pluto" class="flex items-center gap-3">
			<img ngSrc="assets/brand/pluto.png" alt="Pluto" width="40" height="40" priority />
			<span class="text-xl font-semibold text-white">Pluto</span>
		</a>
		<nav>
			<ul class="flex gap-6">
				@for (item of menu(); track item.href) {
					<li>
						<a
							[routerLink]="item.href"
							routerLinkActive="text-violet-300 font-medium"
							class="text-slate-300 hover:text-violet-300 transition-colors"
						>
							{{ item.label }}
						</a>
					</li>
				}
			</ul>
		</nav>
	</div>
</header>

<main class="container mx-auto px-6">
	<router-outlet />
</main>

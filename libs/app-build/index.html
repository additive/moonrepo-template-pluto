<!doctype html>
<html dir="ltr" lang="en">
	<head>
		<base href="/" />
		<meta charset="utf-8" />

		<title>{name}</title>

		<meta
			content="noindex, nofollow, noarchive, nosnippet, notranslate, noimageindex"
			name="robots"
		/>
		<meta content="{description}" name="description" />
		<meta
			content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
			name="viewport"
		/>
		<meta content="{csp}" http-equiv="Content-Security-Policy" />
		<meta content="en" name="language" />
		<meta content="{name}" name="generator" />

		<link href="/manifest.webmanifest" rel="manifest" />
		<!-- <link href="/assets/pwa/favicon.ico" rel="icon" sizes="48x48" /> -->
		<!-- <link href="/assets/pwa/apple-touch-icon-180x180.png" rel="apple-touch-icon" /> -->
		<meta content="{name}" name="apple-mobile-web-app-title" />
		<meta content="{name}" name="application-name" />
		<meta content="#2d2d2d" name="theme-color" />
	</head>

	<body>
		<app-root></app-root>

		<noscript>
			<h1>Die Pluto Applikation funktioniert nur mit aktivierten JavaScript</h1>
			<style>
				h1 {
					margin-inline-start: auto;
					margin-inline-end: auto;
					margin-block-start: 120px;

					max-width: 80%;

					text-align: center;

					white-space: pre-line;

					font-family: Arial, Helvetica, sans-serif;
					font-size: 60px;
					font-weight: 800;
				}
			</style>
		</noscript>
	</body>
</html>
